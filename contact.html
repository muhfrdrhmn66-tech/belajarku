<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Haldan</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: linear-gradient(135deg, #8B0000, #DC143C);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:90%;
            max-width:800px;
            background:white;
            border-radius:20px;
            padding:40px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            color:#B22222;
            margin-bottom:10px;
        }

        .subtitle{
            text-align:center;
            color:#666;
            margin-bottom:30px;
        }

        .contact-info{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:30px;
        }

        .card{
            background:#ffe5e5;
            padding:20px;
            border-radius:15px;
            text-align:center;
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
            background:#ffcccc;
        }

        .card h3{
            color:#B22222;
            margin-bottom:10px;
        }

        .card p{
            color:#444;
        }

        form{
            margin-top:20px;
        }

        .input-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            color:#B22222;
            font-weight:bold;
        }

        input, textarea{
            width:100%;
            padding:12px;
            border:2px solid #ddd;
            border-radius:10px;
            outline:none;
        }

        input:focus,
        textarea:focus{
            border-color:#DC143C;
        }

        textarea{
            resize:none;
            height:120px;
        }

        button{
            width:100%;
            padding:12px;
            background:#B22222;
            color:white;
            border:none;
            border-radius:10px;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#8B0000;
        }
    </style>
</head>
<body>

    <div class="container">

        <h1>Hubungi Saya</h1>
        <p class="subtitle">
            Silakan hubungi saya melalui informasi berikut atau kirim pesan langsung.
        </p>

        <div class="contact-info">

            <div class="card">
                <h3>📱 Telepon</h3>
                <p>0812-3456-7890</p>
            </div>

            <div class="card">
                <h3>📧 Email</h3>
                <p>haldanur@email.com</p>
            </div>

            <div class="card">
                <h3>📍 Alamat</h3>
                <p>Bone, Sulawesi Selatan, Indonesia</p>
            </div>

        </div>

        <form>
            <div class="input-group">
                <label>Nama Lengkap</label>
                <input type="text" placeholder="Masukkan nama Anda">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Masukkan email Anda">
            </div>

            <div class="input-group">
                <label>Pesan</label>
                <textarea placeholder="Tulis pesan Anda di sini..."></textarea>
            </div>

            <button type="submit">Kirim Pesan</button>
        </form>

    </div>

</body>
</html>
