<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Person</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#8B0000,#DC143C);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:100%;
    max-width:1000px;
    background:#fff;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.header{
    background:linear-gradient(135deg,#B22222,#DC143C);
    color:white;
    text-align:center;
    padding:40px;
}

.header img{
    width:150px;
    height:150px;
    border-radius:50%;
    border:5px solid white;
    object-fit:cover;
    margin-bottom:15px;
}

.header h1{
    font-size:36px;
    margin-bottom:10px;
}

.header p{
    font-size:18px;
}

.content{
    padding:40px;
}

.contact-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
    margin-bottom:40px;
}

.card{
    background:#fff0f0;
    border-radius:15px;
    padding:25px;
    text-align:center;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 5px 15px rgba(220,20,60,0.3);
}

.card h3{
    color:#B22222;
    margin-bottom:10px;
}

.card p{
    color:#555;
}

.icon{
    font-size:40px;
    margin-bottom:10px;
}

.form-title{
    text-align:center;
    color:#B22222;
    margin-bottom:20px;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    color:#B22222;
    font-weight:bold;
}

input, textarea{
    width:100%;
    padding:12px;
    border:2px solid #ddd;
    border-radius:10px;
    outline:none;
}

input:focus,
textarea:focus{
    border-color:#DC143C;
}

textarea{
    height:120px;
    resize:none;
}

button{
    width:100%;
    padding:14px;
    background:#B22222;
    color:white;
    border:none;
    border-radius:10px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#8B0000;
}

.footer{
    background:#B22222;
    color:white;
    text-align:center;
    padding:15px;
}

@media(max-width:768px){

    .header h1{
        font-size:28px;
    }

    .content{
        padding:25px;
    }

    .header img{
        width:120px;
        height:120px;
    }
}
</style>

</head>
<body>

<div class="container">

    <div class="header">
        <img src="foto haldan.jpeg" alt="Foto Profil">

        <h1>Contact Person</h1>
        <p>Silakan hubungi saya melalui kontak berikut</p>
    </div>

    <div class="content">

        <div class="contact-grid">

            <div class="card">
                <div class="icon">👤</div>
                <h3>Nama</h3>
                <p>Andi Haldan Nur</p>
            </div>

            <div class="card">
                <div class="icon">📱</div>
                <h3>WhatsApp</h3>
                <p>082 194 319 930</p>
            </div>

            <div class="card">
                <div class="icon">📧</div>
                <h3>Email</h3>
                <p>Haldannur@email.com</p>
            </div>

            <div class="card">
                <div class="icon">📍</div>
                <h3>Alamat</h3>
                <p>Bone, Sulawesi Selatan, Indonesia</p>
            </div>

        </div>

        <h2 class="form-title">Kirim Pesan</h2>

        <form>

            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" placeholder="Masukkan nama Anda">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Masukkan email Anda">
            </div>

            <div class="form-group">
                <label>Pesan</label>
                <textarea placeholder="Tulis pesan Anda di sini..."></textarea>
            </div>

            <button type="submit">Kirim Pesan</button>

        </form>

    </div>

    <div class="footer">
        © 2026 | Contact Person Andi Haldan Nur
    </div>

</div>

</body>
</html>
