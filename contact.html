<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Person</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#ffd6e7,#ff69b4);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .container{
            width:100%;
            max-width:900px;
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        .header{
            background:#ff69b4;
            color:white;
            text-align:center;
            padding:35px;
        }

        .header h1{
            font-size:36px;
            margin-bottom:10px;
        }

        .header p{
            font-size:16px;
        }

        .content{
            padding:40px;
        }

        .contact-card{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:35px;
        }

        .card{
            background:#fff0f5;
            padding:25px;
            text-align:center;
            border-radius:15px;
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
            box-shadow:0 5px 15px rgba(255,105,180,0.3);
        }

        .icon{
            font-size:40px;
            margin-bottom:10px;
        }

        .card h3{
            color:#ff1493;
            margin-bottom:10px;
        }

        .card p{
            color:#555;
        }

        .form-title{
            text-align:center;
            color:#ff1493;
            margin-bottom:20px;
        }

        .input-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            color:#ff1493;
            font-weight:600;
        }

        input,
        textarea{
            width:100%;
            padding:12px;
            border:2px solid #ffc0cb;
            border-radius:10px;
            outline:none;
        }

        input:focus,
        textarea:focus{
            border-color:#ff69b4;
        }

        textarea{
            resize:none;
            height:120px;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#ff69b4;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#ff1493;
        }

        .footer{
            background:#ff69b4;
            color:white;
            text-align:center;
            padding:15px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>Contact Person</h1>
        <p>Silakan hubungi saya melalui informasi berikut</p>
    </div>

    <div class="content">

        <div class="contact-card">

            <div class="card">
                <div class="icon">👤</div>
                <h3>Nama</h3>
                <p>Nur Hikma Rahmadani</p>
            </div>

            <div class="card">
                <div class="icon">📱</div>
                <h3>WhatsApp</h3>
                <p>0882 0217 20467</p>
            </div>

            <div class="card">
                <div class="icon">📧</div>
                <h3>Email</h3>
                <p>nurhikma@email.com</p>
            </div>

            <div class="card">
                <div class="icon">📍</div>
                <h3>Alamat</h3>
                <p>Gowa, Sulawesi Selatan, Indonesia</p>
            </div>

        </div>

        <h2 class="form-title">Kirim Pesan</h2>

        <form>
            <div class="input-group">
                <label>Nama Lengkap</label>
                <input type="text" placeholder="Masukkan nama Anda">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Masukkan email Anda">
            </div>

            <div class="input-group">
                <label>Pesan</label>
                <textarea placeholder="Tulis pesan Anda..."></textarea>
            </div>

            <button type="submit">Kirim Pesan</button>
        </form>

    </div>

    <div class="footer">
        © 2026 | Contact Person Nur Hikma Rahmadani
    </div>

</div>

</body>
</html>
