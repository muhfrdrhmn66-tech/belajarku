<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Person</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(135deg,#FFD700,#FFF176);
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .container{
            width:100%;
            max-width:1000px;
            background:white;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        .header{
            background:linear-gradient(135deg,#FFC107,#FFD700);
            text-align:center;
            padding:40px;
            color:#333;
        }

        .header img{
            width:150px;
            height:150px;
            border-radius:50%;
            border:5px solid white;
            object-fit:cover;
            margin-bottom:15px;
        }

        .header h1{
            font-size:38px;
            margin-bottom:10px;
        }

        .header p{
            font-size:18px;
        }

        .content{
            padding:40px;
        }

        .contact-grid{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
            gap:20px;
            margin-bottom:35px;
        }

        .card{
            background:#FFF9C4;
            padding:25px;
            border-radius:15px;
            text-align:center;
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
            box-shadow:0 5px 15px rgba(255,193,7,0.4);
        }

        .icon{
            font-size:40px;
            margin-bottom:10px;
        }

        .card h3{
            color:#E6A700;
            margin-bottom:10px;
        }

        .card p{
            color:#555;
        }

        .form-title{
            text-align:center;
            color:#E6A700;
            margin-bottom:20px;
        }

        .form-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            color:#E6A700;
            font-weight:bold;
        }

        input,
        textarea{
            width:100%;
            padding:12px;
            border:2px solid #ddd;
            border-radius:10px;
            outline:none;
        }

        input:focus,
        textarea:focus{
            border-color:#FFC107;
        }

        textarea{
            height:120px;
            resize:none;
        }

        button{
            width:100%;
            padding:14px;
            background:#FFC107;
            color:#333;
            border:none;
            border-radius:10px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#FFD700;
        }

        .footer{
            background:#FFC107;
            color:#333;
            text-align:center;
            padding:15px;
            font-weight:bold;
        }

        @media(max-width:768px){

            .header img{
                width:120px;
                height:120px;
            }

            .header h1{
                font-size:30px;
            }

            .content{
                padding:25px;
            }
        }
    </style>

</head>
<body>

<div class="container">

    <div class="header">

        <img src="foto.jpeg" alt="Foto Profil">

        <h1>CONTACT PERSON</h1>

        <p>Silakan hubungi saya melalui kontak berikut</p>

    </div>

    <div class="content">

        <div class="contact-grid">

            <div class="card">
                <div class="icon">👤</div>
                <h3>Nama</h3>
                <p>Fadiah Nur Fadillah</p>
            </div>

            <div class="card">
                <div class="icon">📱</div>
                <h3>WhatsApp</h3>
                <p>0858 2505 7109</p>
            </div>

            <div class="card">
                <div class="icon">📧</div>
                <h3>Email</h3>
                <p>fadiah@email.com</p>
            </div>

            <div class="card">
                <div class="icon">📍</div>
                <h3>Alamat</h3>
                <p>Makassar, Sulawesi Selatan, Indonesia</p>
            </div>

        </div>

        <h2 class="form-title">Kirim Pesan</h2>

        <form>

            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" placeholder="Masukkan nama Anda">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Masukkan email Anda">
            </div>

            <div class="form-group">
                <label>Subjek</label>
                <input type="text" placeholder="Masukkan subjek pesan">
            </div>

            <div class="form-group">
                <label>Pesan</label>
                <textarea placeholder="Tulis pesan Anda di sini..."></textarea>
            </div>

            <button type="submit">Kirim Pesan</button>

        </form>

    </div>

    <div class="footer">
        © 2026 | Contact Person Fadiah Nur Fadillah
    </div>

</div>

</body>
</html>
